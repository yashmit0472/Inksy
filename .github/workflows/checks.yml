name: Checks

on:
  push:
  pull_request:

jobs:
  ml-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime
        run: python -m pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and checks
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check ml tests
      - name: Non-training tests
        run: python -m pytest --basetemp .cache/pytest
